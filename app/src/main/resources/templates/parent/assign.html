<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Создать задание')}"></head>
<body>
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-parent}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="th-main">

            <div class="lm-page-header">
                <div>
                    <h1 class="lm-page-title">Создать задание</h1>
                    <p class="lm-page-sub">Выберите готовое задание для быстрого заполнения или создайте своё</p>
                </div>
            </div>

            <div th:if="${success}" class="lm-banner ok mb-4">
                <i class="bi bi-check-circle-fill fs-5"></i><span th:text="${success}">Успех</span>
            </div>
            <div th:if="${error}" class="lm-banner err mb-4">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i><span th:text="${error}">Ошибка</span>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/parent/assign}" method="post" id="assignForm">
                        <input type="hidden" name="onboarding" th:value="${onboarding}">
                        <input type="hidden" name="templateId" id="templateId"
                               th:value="${formValues != null ? formValues.get('templateId') : ''}">

                        <div class="row g-3">

                            <div class="col-md-6" th:if="${singleChild == null}">
                                <label class="form-label fw-semibold">Ребёнок</label>
                                <select class="form-select" name="childId" required>
                                    <option value="">Выберите ребёнка...</option>
                                    <option th:each="child : ${children}"
                                            th:value="${child.id}"
                                            th:text="${child.firstName}"
                                            th:selected="${formValues != null and formValues.get('childId') == child.id.toString()}">Ребёнок</option>
                                </select>
                            </div>
                            <input type="hidden" name="childId" th:if="${singleChild != null}" th:value="${singleChild.id}">

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Готовое задание <span class="text-muted fw-normal">(необязательно)</span></label>
                                <select class="form-select" id="readyTaskSelect">
                                    <option value="">— своё задание —</option>
                                    <option th:each="t : ${templates}"
                                            th:value="${t.id}"
                                            th:text="${t.title}"
                                            th:attr="data-title=${t.title},
                                                     data-description=${t.description},
                                                     data-coins=${t.coinsReward}">Задание</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Название</label>
                                <input type="text" class="form-control" id="titleInput" name="title" required maxlength="128"
                                       th:value="${formValues != null ? formValues.get('title') : ''}">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Описание</label>
                                <textarea class="form-control" id="descriptionInput" name="description" rows="2"
                                          placeholder="Что именно нужно сделать?"
                                          th:text="${formValues != null ? formValues.get('description') : ''}"></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Монеты за выполнение</label>
                                <div class="d-flex gap-2 mb-2">
                                    <button type="button" class="btn btn-outline-secondary btn-sm coins-preset" data-coins="3">Маленькое · 3</button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm coins-preset" data-coins="5">Обычное · 5</button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm coins-preset" data-coins="10">Большое · 10</button>
                                </div>
                                <input type="number" class="form-control" id="coinsInput" name="coinsReward" min="0" max="500"
                                       th:value="${formValues != null ? formValues.get('coinsReward') : 5}">
                                <div class="form-text">Опыт начисляется автоматически — задавать его вручную не нужно.</div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Дедлайн (необязательно)</label>
                                <input type="datetime-local" class="form-control" id="dueDateInput" name="dueDate"
                                       th:value="${formValues != null ? formValues.get('dueDateLocal') : ''}"
                                       onchange="toggleDeadlineRecurrence()">
                                <small class="text-muted" id="dueDateHint" style="display:none;">Очистите дедлайн, чтобы выбрать повторение</small>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Повторение</label>
                                <select class="form-select" id="recurrenceSelect" onchange="updateRecurrenceRule(); toggleDeadlineRecurrence();">
                                    <option value="">Не повторять</option>
                                    <option value="DAILY">Каждый день</option>
                                    <option value="WEEKDAYS">По будням</option>
                                    <option value="WEEKLY">Каждую неделю</option>
                                    <option value="CUSTOM_DAYS">Выбранные дни недели</option>
                                </select>
                            </div>

                            <div class="col-12" id="weekdaysRow" style="display:none;">
                                <label class="form-label">Дни недели</label>
                                <div class="d-flex flex-wrap gap-2">
                                    <div class="form-check" th:each="day : ${ {'MO','TU','WE','TH','FR','SA','SU'} }">
                                        <input class="form-check-input weekday-check" type="checkbox"
                                               th:value="${day}" th:id="'day-' + ${day}" onchange="buildCustomRRule()">
                                        <label class="form-check-label" th:for="'day-' + ${day}"
                                               th:text="${day == 'MO' ? 'Пн' : day == 'TU' ? 'Вт' : day == 'WE' ? 'Ср' : day == 'TH' ? 'Чт' : day == 'FR' ? 'Пт' : day == 'SA' ? 'Сб' : 'Вс'}">Пн</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <input type="hidden" id="recurrenceRule" name="recurrenceRule"
                               th:value="${formValues != null ? formValues.get('recurrenceRule') : ''}">

                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-send me-1"></i>Создать и назначить
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // Выбор готового задания — это только автозаполнение полей формы ниже.
    // Пока родитель ничего не менял вручную — форма отправит выбранный templateId как есть.
    // Как только поле изменено — templateId сбрасывается, и сервер создаст новое задание
    // из введённых значений (см. ParentController#assignTask).
    let prefilled = null;

    document.getElementById('readyTaskSelect').addEventListener('change', function () {
        const option = this.options[this.selectedIndex];
        const templateIdField = document.getElementById('templateId');
        const titleField = document.getElementById('titleInput');
        const descField = document.getElementById('descriptionInput');
        const coinsField = document.getElementById('coinsInput');

        if (!this.value) {
            prefilled = null;
            templateIdField.value = '';
            return;
        }

        prefilled = {
            title: option.getAttribute('data-title') || '',
            description: option.getAttribute('data-description') || '',
            coins: option.getAttribute('data-coins') || '5'
        };
        titleField.value = prefilled.title;
        descField.value = prefilled.description;
        coinsField.value = prefilled.coins;
        templateIdField.value = this.value;
    });

    function detachFromTemplateIfEdited() {
        if (!prefilled) return;
        const titleField = document.getElementById('titleInput');
        const descField = document.getElementById('descriptionInput');
        const coinsField = document.getElementById('coinsInput');
        const changed = titleField.value !== prefilled.title
            || descField.value !== prefilled.description
            || coinsField.value !== String(prefilled.coins);
        if (changed) {
            document.getElementById('templateId').value = '';
        }
    }

    ['titleInput', 'descriptionInput', 'coinsInput'].forEach(id => {
        document.getElementById(id).addEventListener('input', detachFromTemplateIfEdited);
    });

    // Пресеты монет
    document.querySelectorAll('.coins-preset').forEach(btn => {
        btn.addEventListener('click', function () {
            document.getElementById('coinsInput').value = this.getAttribute('data-coins');
            detachFromTemplateIfEdited();
        });
    });

    function updateRecurrenceRule() {
        const preset = document.getElementById('recurrenceSelect').value;
        const weekdaysRow = document.getElementById('weekdaysRow');
        const ruleInput = document.getElementById('recurrenceRule');

        weekdaysRow.style.display = preset === 'CUSTOM_DAYS' ? 'block' : 'none';

        switch (preset) {
            case 'DAILY':
                ruleInput.value = 'FREQ=DAILY';
                break;
            case 'WEEKDAYS':
                ruleInput.value = 'FREQ=DAILY;BYDAY=MO,TU,WE,TH,FR';
                break;
            case 'WEEKLY':
                ruleInput.value = 'FREQ=WEEKLY';
                break;
            case 'CUSTOM_DAYS':
                buildCustomRRule();
                break;
            default:
                ruleInput.value = '';
        }
    }

    function buildCustomRRule() {
        const checked = document.querySelectorAll('.weekday-check:checked');
        const ruleInput = document.getElementById('recurrenceRule');
        if (checked.length === 0) {
            ruleInput.value = '';
            return;
        }
        const days = Array.from(checked).map(c => c.value).join(',');
        ruleInput.value = 'FREQ=WEEKLY;BYDAY=' + days;
    }

    function toggleDeadlineRecurrence() {
        const dueDate = document.getElementById('dueDateInput');
        const recurrence = document.getElementById('recurrenceSelect');
        const hint = document.getElementById('dueDateHint');
        const weekdaysRow = document.getElementById('weekdaysRow');
        const ruleInput = document.getElementById('recurrenceRule');

        if (dueDate.value) {
            recurrence.value = '';
            recurrence.disabled = true;
            ruleInput.value = '';
            weekdaysRow.style.display = 'none';
            hint.style.display = 'block';
        } else if (recurrence.value) {
            dueDate.value = '';
            dueDate.disabled = true;
            hint.style.display = 'none';
        } else {
            recurrence.disabled = false;
            dueDate.disabled = false;
            hint.style.display = 'none';
        }
    }
</script>
</body>
</html>
