<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Пользователи')}"></head>
<body>
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-admin}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="th-main">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-people-fill me-2"></i>Пользователи</h4>
            </div>

            <!-- Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filters -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" th:action="@{/admin/users}" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Поиск</label>
                            <input type="text" name="q" class="form-control" placeholder="Email..."
                                   th:value="${searchQuery}">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Роль</label>
                            <select name="role" class="form-select">
                                <option value="">Все роли</option>
                                <option value="PARENT" th:selected="${selectedRole == 'PARENT'}">Родитель</option>
                                <option value="ADMIN" th:selected="${selectedRole == 'ADMIN'}">Админ</option>
                            </select>
                            <small class="text-muted"><a th:href="@{/admin/children}">Дети — в отдельном разделе</a></small>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Статус</label>
                            <select name="active" class="form-select">
                                <option value="">Все</option>
                                <option value="true" th:selected="${selectedActive != null && selectedActive}">Активные</option>
                                <option value="false" th:selected="${selectedActive != null && !selectedActive}">Заблокированные</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search me-1"></i>Найти
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Users table -->
            <div class="card">
                <div class="card-body">
                    <div th:if="${users == null || #lists.isEmpty(users)}" class="text-center py-4">
                        <p class="text-muted mb-0">Пользователи не найдены</p>
                    </div>
                    <div class="table-responsive" th:unless="${users == null || #lists.isEmpty(users)}">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Email</th>
                                <th>Роль</th>
                                <th>Статус</th>
                                <th class="text-end">Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td class="fw-semibold" th:text="${user['email']}">email</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${user['role'] == 'ADMIN' ? 'bg-danger' : (user['role'] == 'PARENT' ? 'bg-primary' : 'bg-warning text-dark')}"
                                          th:text="${user['role']}">ROLE</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${user['isActive'] == true ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${user['isActive'] == true ? 'Активен' : 'Заблокирован'}">Status</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <!-- Toggle active -->
                                        <form method="post"
                                              th:action="@{/admin/users/{id}/toggle-active(id=${user['id']})}"
                                              class="d-inline">
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${user['isActive'] == true ? 'btn-outline-warning' : 'btn-outline-success'}"
                                                    th:title="${user['isActive'] == true ? 'Заблокировать' : 'Разблокировать'}">
                                                <i class="bi" th:classappend="${user['isActive'] == true ? 'bi-lock' : 'bi-unlock'}"></i>
                                            </button>
                                        </form>
                                        <!-- Reset password -->
                                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#passwordModal-' + ${user['id']}"
                                                title="Сменить пароль">
                                            <i class="bi bi-key"></i>
                                        </button>
                                        <!-- Change role -->
                                        <button type="button" class="btn btn-sm btn-outline-info"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#roleModal-' + ${user['id']}"
                                                title="Изменить роль">
                                            <i class="bi bi-person-gear"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${totalPages != null && totalPages > 1}" class="mt-3">
                        <ul class="pagination pagination-sm justify-content-center mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, size=20, role=${selectedRole}, active=${selectedActive}, q=${searchQuery})}">«</a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item"
                                th:classappend="${i == currentPage ? 'active' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${i}, size=20, role=${selectedRole}, active=${selectedActive}, q=${searchQuery})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, size=20, role=${selectedRole}, active=${selectedActive}, q=${searchQuery})}">»</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

            <!-- Role change / Password / Delete modals -->
            <div th:each="user : ${users}">
                <!-- Password reset modal -->
                <div class="modal fade" th:id="'passwordModal-' + ${user['id']}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form method="post" th:action="@{/admin/users/{id}/password(id=${user['id']})}">
                                <div class="modal-header">
                                    <h5 class="modal-title">Сменить пароль</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <p>Пользователь: <strong th:text="${user['email']}">email</strong></p>
                                    <div class="mb-3">
                                        <label class="form-label">Новый пароль</label>
                                        <input type="password" name="password" class="form-control"
                                               required minlength="6" placeholder="Минимум 6 символов"/>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                                    <button type="submit" class="btn btn-primary">Установить пароль</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- Role change modal -->
                <div class="modal fade" th:id="'roleModal-' + ${user['id']}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form method="post" th:action="@{/admin/users/{id}/role(id=${user['id']})}">
                                <div class="modal-header">
                                    <h5 class="modal-title">Изменить роль</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <p>Пользователь: <strong th:text="${user['email']}">email</strong></p>
                                    <div class="mb-3">
                                        <label class="form-label">Новая роль</label>
                                        <select name="role" class="form-select">
                                            <option value="PARENT" th:selected="${user['role'] == 'PARENT'}">Родитель</option>
                                            <option value="CHILD" th:selected="${user['role'] == 'CHILD'}">Ребёнок</option>
                                            <option value="ADMIN" th:selected="${user['role'] == 'ADMIN'}">Админ</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                                    <button type="submit" class="btn btn-primary">Сохранить</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
