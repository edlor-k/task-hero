<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Мои задания')}"></head>
<body class="lm-has-bottom-tab"
      th:classappend="${childBackgroundUrl != null} ? 'lm-has-bg-image'"
      th:attr="data-accent=${childAccentColor}">
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-child}"></nav>
    <nav th:replace="~{fragments/layout :: bottom-tab-child}"></nav>
    <div class="th-content"
         th:style="${childBackgroundUrl != null}
             ? 'background: url(' + ${childBackgroundUrl} + ') center top / cover no-repeat;'
             : null">
        <header th:replace="~{fragments/layout :: topbar-child(coins=${topbarCoins}, avatarUrl=${topbarAvatarUrl})}"></header>
        <main class="th-main">

            <div class="lm-page-header">
                <div>
                    <h1 class="lm-page-title">Мои задания</h1>
                    <p class="lm-page-sub">Выполняй задания и зарабатывай монеты</p>
                </div>
            </div>

            <div th:if="${success}" class="lm-banner ok mb-4">
                <i class="bi bi-check-circle-fill fs-5"></i>
                <span th:text="${success}">Успех</span>
            </div>

            <!-- Status filters -->
            <div class="d-flex flex-wrap gap-2 mb-4">
                <a th:href="@{/child/tasks}"
                   class="lm-chip"
                   th:classappend="${currentStatus == null} ? ' primary' : ''"
                   style="text-decoration:none;padding:7px 14px;">Все</a>
                <a th:href="@{/child/tasks(status='CREATED')}"
                   class="lm-chip"
                   th:classappend="${currentStatus == 'CREATED'} ? ' primary' : ''"
                   style="text-decoration:none;padding:7px 14px;">
                    <i class="bi bi-circle me-1"></i>Новые
                </a>
                <a th:href="@{/child/tasks(status='SUBMITTED')}"
                   class="lm-chip"
                   th:classappend="${currentStatus == 'SUBMITTED'} ? ' warning' : ''"
                   style="text-decoration:none;padding:7px 14px;">
                    <i class="bi bi-hourglass-split me-1"></i>На проверке
                </a>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(assignments)}" class="lm-empty-state">
                <div class="lm-empty-icon">📬</div>
                <div class="lm-empty-title">Нет заданий</div>
                <div class="lm-empty-sub">Здесь будут появляться твои задания</div>
            </div>

            <!-- Assignments list -->
            <div th:unless="${#lists.isEmpty(assignments)}" class="d-flex flex-column gap-3">
                <div th:each="a : ${assignments}">
                    <div class="lm-child-task"
                         th:classappend="${a.status == 'SUBMITTED' ? 'submitted' :
                                          a.status == 'APPROVED'  ? 'approved' :
                                          a.status == 'REJECTED'  ? 'rejected' : ''}">
                        <div class="lm-ct-icon">
                            <span th:if="${a.status == 'APPROVED'}">✅</span>
                            <span th:if="${a.status == 'REJECTED'}">❌</span>
                            <span th:if="${a.status == 'SUBMITTED'}">⏳</span>
                            <span th:if="${a.status == 'CREATED' and a.important}">⚠️</span>
                            <i class="bi bi-list-check"
                               th:if="${a.status == 'CREATED' and !a.important}"></i>
                        </div>

                        <div class="lm-ct-body">
                            <div class="lm-ct-title-text" th:text="${a.template?.title}">Задание</div>
                            <div class="lm-ct-meta">
                                <span th:if="${a.template?.expReward}">⭐ <span th:text="${a.template.expReward}">10</span> EXP</span>
                                <span th:if="${a.template?.coinsReward}">🪙 <span th:text="${a.template.coinsReward}">5</span></span>
                                <span th:if="${a.dueDate}">
                                    <i class="bi bi-clock"></i>
                                    <span th:attr="data-utc-datetime=${a.dueDate}" th:text="${a.dueDate}">срок</span>
                                </span>
                                <span th:if="${a.template?.difficulty}"
                                      class="lm-chip"
                                      th:classappend="${a.template.difficulty == 'EASY' ? ' success' :
                                                        a.template.difficulty == 'HARD' ? ' danger' : ' warning'}"
                                      th:text="${a.template.difficulty == 'EASY' ? 'Лёгкое' :
                                                 a.template.difficulty == 'HARD' ? 'Сложное' : 'Обычное'}"
                                      style="font-size:10px;"></span>
                            </div>

                            <!-- Sub-items -->
                            <div th:if="${a.template?.subItems != null and !a.template.subItems.isEmpty()}"
                                 class="mt-1">
                                <div th:each="sub : ${a.template.subItems}"
                                     style="font-size:var(--fs-xs);color:var(--ink-500);">
                                    <i class="bi bi-check2-square me-1"></i><span th:text="${sub.title}">Подзадача</span>
                                </div>
                            </div>

                            <!-- Approved reward -->
                            <div th:if="${a.status == 'APPROVED'}"
                                 style="font-size:var(--fs-xs);color:oklch(0.30 0.12 150);margin-top:4px;font-weight:600;">
                                <i class="bi bi-check-circle-fill me-1"></i>Одобрено
                                <span th:if="${a.expEarned}"> · +<span th:text="${a.expEarned}">10</span> EXP</span>
                                <span th:if="${a.coinsEarned}"> · +<span th:text="${a.coinsEarned}">5</span> 🪙</span>
                            </div>

                            <!-- Rejected comment -->
                            <div th:if="${a.status == 'REJECTED'}"
                                 style="font-size:var(--fs-xs);color:oklch(0.30 0.14 25);margin-top:4px;">
                                <i class="bi bi-x-circle-fill me-1"></i>Отклонено
                                <span th:if="${a.parentComment}"> — <span th:text="${a.parentComment}">Комментарий</span></span>
                            </div>
                        </div>

                        <!-- Action -->
                        <div class="flex-shrink-0">
                            <form th:if="${a.status == 'CREATED' and (a.dueDate == null or !a.dueDate.isBefore(T(java.time.Instant).now()))}"
                                  th:action="@{/child/tasks/{id}/submit(id=${a.id})}" method="post">
                                <button type="submit" class="lm-ct-btn">Сдать ✓</button>
                            </form>
                            <span th:if="${a.status == 'CREATED' and a.dueDate != null and a.dueDate.isBefore(T(java.time.Instant).now())}"
                                  class="lm-chip danger">Просрочено</span>
                            <span th:if="${a.status == 'SUBMITTED'}" class="lm-chip warning">На проверке</span>
                            <span th:if="${a.status == 'APPROVED'}" class="lm-chip success">Готово ✓</span>
                            <span th:if="${a.status == 'REJECTED'}" class="lm-chip danger">Отклонено</span>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
