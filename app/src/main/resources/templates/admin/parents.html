<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Родители')}"></head>
<body>
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-admin}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="th-main">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-person-badge-fill me-2"></i>Родители</h4>
            </div>

            <!-- Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Filters -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" th:action="@{/admin/parents}" class="row g-3 align-items-end">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Поиск</label>
                            <input type="text" name="q" class="form-control" placeholder="Имя, фамилия или email..."
                                   th:value="${searchQuery}">
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-search me-1"></i>Найти
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Parents table -->
            <div class="card">
                <div class="card-body">
                    <div th:if="${parents == null || #lists.isEmpty(parents)}" class="text-center py-4">
                        <p class="text-muted mb-0">Родители не найдены</p>
                    </div>
                    <div class="table-responsive" th:unless="${parents == null || #lists.isEmpty(parents)}">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Имя</th>
                                <th>Email</th>
                                <th>Детей</th>
                                <th>Статус</th>
                                <th class="text-end">Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="parent : ${parents}">
                                <td class="fw-semibold" th:text="${parent['firstName'] + ' ' + parent['surname']}">Имя</td>
                                <td th:text="${parent['user'] != null ? parent['user']['email'] : '-'}">email</td>
                                <td>
                                    <span class="badge bg-info" th:text="${parent['totalChildren'] != null ? parent['totalChildren'] : 0}">0</span>
                                </td>
                                <td th:with="userActive=${parent['user'] != null && (parent['user']['isActive'] == true || parent['user']['active'] == true)}">
                                    <span class="badge"
                                          th:if="${parent['user'] != null}"
                                          th:classappend="${userActive ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${userActive ? 'Активен' : 'Заблокирован'}">Status</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/parents/{id}(id=${parent['id']})}"
                                       class="btn btn-sm btn-outline-primary" title="Подробнее">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${totalPages != null && totalPages > 1}" class="mt-3">
                        <ul class="pagination pagination-sm justify-content-center mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/parents(page=${currentPage - 1}, q=${searchQuery})}">«</a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item"
                                th:classappend="${i == currentPage ? 'active' : ''}">
                                <a class="page-link" th:href="@{/admin/parents(page=${i}, q=${searchQuery})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/parents(page=${currentPage + 1}, q=${searchQuery})}">»</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
