<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход для ребёнка')}"></head>
<body style="background:linear-gradient(160deg, oklch(0.96 0.04 240) 0%, oklch(0.97 0.03 200) 60%, oklch(0.95 0.05 140) 100%);
             min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s-6);">
    <div style="width:100%;max-width:380px;">

        <!-- Logo -->
        <div class="text-center mb-5">
            <div style="font-size:72px;margin-bottom:8px;">🎮</div>
            <h2 style="font-size:var(--fs-3xl);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em;margin:0;">TaskGamer</h2>
            <p style="color:var(--ink-500);font-size:var(--fs-sm);margin-top:6px;">Войди и получай награды!</p>
        </div>

        <!-- Card -->
        <div class="auth-card">

            <div th:if="${error}" class="lm-banner err mb-4">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}">Ошибка</span>
            </div>

            <form th:action="@{/login/child}" method="post">
                <div class="mb-4">
                    <label for="loginToken" class="form-label fw-bold" style="font-size:var(--fs-base);">
                        Твой секретный токен
                    </label>
                    <input type="text" class="form-control form-control-lg text-center text-uppercase"
                           id="loginToken" name="loginToken"
                           placeholder="ABC123XY" required autofocus
                           style="letter-spacing:0.3em;font-weight:700;font-family:var(--font-mono);
                                  font-size:var(--fs-2xl);height:64px;border-radius:var(--r-md);">
                    <div class="text-center mt-2" style="font-size:var(--fs-sm);color:var(--ink-500);">
                        Спроси токен у мамы или папы
                    </div>
                </div>
                <button type="submit" class="lm-btn lm-btn-primary lm-btn-xl w-100 justify-content-center"
                        style="background:var(--brand-success);">
                    <i class="bi bi-controller me-2"></i>Войти и играть!
                </button>
            </form>

            <div class="text-center mt-4">
                <a th:href="@{/login}" class="text-decoration-none d-inline-flex align-items-center gap-1"
                   style="color:var(--ink-500);font-size:var(--fs-sm);">
                    <i class="bi bi-arrow-left"></i>Вход для родителей
                </a>
            </div>
        </div>
    </div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
