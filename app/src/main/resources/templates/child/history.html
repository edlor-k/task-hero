<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('История заданий')}"></head>
<body class="lm-has-bottom-tab">
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-child}"></nav>
    <nav th:replace="~{fragments/layout :: bottom-tab-child}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: topbar-child(coins=${topbarCoins}, avatarUrl=${topbarAvatarUrl})}"></header>
        <main class="th-main">

            <div class="lm-page-header">
                <div>
                    <h1 class="lm-page-title">История заданий</h1>
                    <p class="lm-page-sub">Все выполненные задания</p>
                </div>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(assignments)}" class="lm-empty-state">
                <div class="lm-empty-icon">📖</div>
                <div class="lm-empty-title">История пуста</div>
                <div class="lm-empty-sub">Выполненные задания появятся здесь</div>
            </div>

            <!-- History feed -->
            <div th:unless="${#lists.isEmpty(assignments)}" class="d-flex flex-column gap-2">
                <div th:each="a : ${assignments}"
                     class="lm-history-item"
                     th:classappend="${a.status == 'APPROVED' ? 'approved' :
                                      a.status == 'REJECTED' ? 'rejected' : 'pending'}">

                    <div class="lm-hi-icon">
                        <span th:if="${a.status == 'APPROVED'}">✅</span>
                        <span th:if="${a.status == 'REJECTED'}">❌</span>
                        <span th:unless="${a.status == 'APPROVED' or a.status == 'REJECTED'}">⏳</span>
                    </div>

                    <div class="lm-hi-body">
                        <div class="lm-hi-title" th:text="${a.template?.title}">Задание</div>
                        <div class="lm-hi-date">
                            <span th:if="${a.reviewedAt}"
                                  th:attr="data-utc-datetime=${a.reviewedAt}"
                                  th:text="${a.reviewedAt}">дата</span>
                            <span th:if="${a.parentComment}"
                                  style="color:var(--ink-400);">
                                · <span th:text="${a.parentComment}">Комментарий</span>
                            </span>
                        </div>
                    </div>

                    <!-- Earned rewards -->
                    <div th:if="${a.status == 'APPROVED'}" class="text-end flex-shrink-0">
                        <div class="lm-hi-reward" th:if="${a.coinsEarned}">
                            🪙 +<span th:text="${a.coinsEarned}">5</span>
                        </div>
                        <div style="font-size:var(--fs-xs);color:oklch(0.35 0.12 150);font-weight:600;" th:if="${a.expEarned}">
                            ⭐ +<span th:text="${a.expEarned}">10</span> EXP
                        </div>
                    </div>
                    <span th:unless="${a.status == 'APPROVED'}"
                          class="lm-chip ms-auto"
                          th:classappend="${a.status == 'REJECTED' ? ' danger' : ' warning'}"
                          th:text="${a.status == 'REJECTED' ? 'Отклонено' : 'На проверке'}">Статус</span>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
