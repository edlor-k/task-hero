<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Маркетплейс наград')}"></head>
<body>
<th:block th:replace="~{fragments/layout :: header}"></th:block>
<div class="sidebar-overlay"></div>
<th:block th:replace="~{fragments/layout :: sidebar-admin}"></th:block>
<main class="main">
    <div class="main-content">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-shop-window me-2"></i>Маркетплейс наград</h4>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">
                    <i class="bi bi-plus-lg me-1"></i>Добавить товар
                </button>
            </div>

            <!-- Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Поиск</label>
                            <input type="text" id="marketplaceSearch" class="form-control" placeholder="Название товара...">
                        </div>
                        <div class="col-md-4">
                            <button type="button" class="btn btn-secondary w-100" onclick="document.getElementById('marketplaceSearch').value='';filterMarketplace();">
                                <i class="bi bi-x-lg me-1"></i>Сбросить
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Items table -->
            <div class="card">
                <div class="card-body">
                    <div th:if="${items == null || #lists.isEmpty(items)}" class="text-center py-4">
                        <p class="text-muted mb-0">Нет товаров в маркетплейсе</p>
                    </div>
                    <div class="table-responsive" th:unless="${items == null || #lists.isEmpty(items)}">
                        <table id="marketplaceTable" class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th></th>
                                <th>Название</th>
                                <th>Описание</th>
                                <th>Цена (коины)</th>
                                <th>Статус</th>
                                <th class="text-end">Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="item : ${items}">
                                <td>
                                    <i class="bi fs-4" th:classappend="${item['iconName'] ?: 'bi-gift'}"></i>
                                </td>
                                <td class="fw-semibold" th:text="${item['title']}">—</td>
                                <td>
                                    <small class="text-muted" th:text="${item['description']}">—</small>
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark" th:text="${item['priceCoins']}">0</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${item['active'] == true ? 'bg-success' : 'bg-secondary'}"
                                          th:text="${item['active'] == true ? 'Активен' : 'Выключен'}">-</span>
                                </td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-primary me-1"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#editModal-' + ${item['id']}"
                                            title="Редактировать">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <form method="post" th:action="@{'/admin/marketplace/' + ${item['id']} + '/delete'}" class="d-inline"
                                          onsubmit="return confirm('Удалить товар?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Удалить">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Create Modal -->
            <div class="modal fade" id="createModal" tabindex="-1">
                <div class="modal-dialog">
                    <form method="post" th:action="@{/admin/marketplace}" class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Новый товар</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Название *</label>
                                <input type="text" name="title" class="form-control" required maxlength="128"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Описание</label>
                                <textarea name="description" class="form-control" rows="3" maxlength="512"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Цена (коины) *</label>
                                <input type="number" name="priceCoins" class="form-control" required min="1" value="10"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Иконка (Bootstrap Icons)</label>
                                <input type="text" name="iconName" class="form-control" placeholder="bi-gift"/>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                            <button type="submit" class="btn btn-primary">Создать</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Edit Modals (one per item) -->
            <div th:each="item : ${items}" class="modal fade" th:id="'editModal-' + ${item['id']}" tabindex="-1">
                <div class="modal-dialog">
                    <form method="post" th:action="@{'/admin/marketplace/' + ${item['id']} + '/edit'}" class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Редактировать товар</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Название *</label>
                                <input type="text" name="title" class="form-control" required maxlength="128"
                                       th:value="${item['title']}"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Описание</label>
                                <textarea name="description" class="form-control" rows="3" maxlength="512"
                                          th:text="${item['description']}"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Цена (коины) *</label>
                                <input type="number" name="priceCoins" class="form-control" required min="1"
                                       th:value="${item['priceCoins']}"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Иконка (Bootstrap Icons)</label>
                                <input type="text" name="iconName" class="form-control"
                                       th:value="${item['iconName']}"/>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
    </div>
</main>
<a href="#" class="back-to-top"><i class="bi bi-arrow-up-short"></i></a>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
function filterMarketplace() {
    var query = document.getElementById('marketplaceSearch').value.toLowerCase();
    var rows = document.querySelectorAll('#marketplaceTable tbody tr');
    rows.forEach(function(row) {
        var title = row.querySelector('td:nth-child(2)');
        var desc = row.querySelector('td:nth-child(3)');
        var text = ((title ? title.textContent : '') + ' ' + (desc ? desc.textContent : '')).toLowerCase();
        row.style.display = text.indexOf(query) !== -1 ? '' : 'none';
    });
}
document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('marketplaceSearch');
    if (input) input.addEventListener('input', filterMarketplace);
});
</script>
</body>
</html>
