# ============================================================
# Docker Compose для TaskHero (локальная разработка)
# ============================================================
# Использование:
#   Только БД и Adminer (для разработки):
#     docker-compose up -d postgres adminer
#
#   Все сервисы:
#     docker-compose up -d
#
#   Посмотреть логи:
#     docker-compose logs -f [service-name]
#
#   Остановить:
#     docker-compose down
# ============================================================

services:
  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: taskhero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskhero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=80MB"
      - "-c"
      - "effective_cache_size=160MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=48MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "huge_pages=off"
    networks:
      - taskhero-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskhero"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 320M
        reservations:
          cpus: "0.20"
          memory: 160M

  # ==================== Adminer (DB UI) ====================
  adminer:
    image: adminer:latest
    container_name: taskhero-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
        reservations:
          cpus: "0.02"
          memory: 16M
    networks:
      - taskhero-network

  # ==================== User Service ====================
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: taskhero-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskhero
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      JWT_SECRET: mySecretKeyForJWTTokenGenerationThatIsLongEnough256bits
      JWT_EXPIRATION_MS: 86400000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      LOGGING_LEVEL_ROOT: INFO
      JAVA_TOOL_OPTIONS: "-Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/users/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.15"
          memory: 192M
    networks:
      - taskhero-network

  # ==================== Task Service ====================
  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: taskhero-task-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskhero
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      USER_SERVICE_URL: http://user-service:8081/users
      JWT_SECRET: mySecretKeyForJWTTokenGenerationThatIsLongEnough256bits
      LOGGING_LEVEL_ROOT: INFO
      JAVA_TOOL_OPTIONS: "-Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/tasks/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.15"
          memory: 192M
    networks:
      - taskhero-network

  # ==================== App (UI) ====================
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: taskhero-app
    restart: unless-stopped
    depends_on:
      - user-service
      - task-service
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081/users
      TASK_SERVICE_URL: http://task-service:8082/tasks
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      LOGGING_LEVEL_ROOT: INFO
      JAVA_TOOL_OPTIONS: "-Xss512k -XX:MaxMetaspaceSize=110m -XX:ReservedCodeCacheSize=40m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
        reservations:
          cpus: "0.10"
          memory: 160M
    networks:
      - taskhero-network

networks:
  taskhero-network:
    driver: bridge
    name: taskhero-network

volumes:
  postgres-data:
    driver: local
    name: taskhero-postgres-data
