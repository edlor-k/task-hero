# ============================================================
# Docker Compose — Production (VPS + Caddy HTTPS)
# ============================================================
# Целевой VPS: 2 x 3.3 GHz CPU • 2 GB RAM • 40 GB NVMe
# Бюджет RAM: ~1700 MB (после ОС) → лимиты контейнеров 1456 MB
#
# Использование:
#   1. cp .env.example .env && nano .env
#   2. docker compose -f docker-compose.dev.yml up -d --build
#   3. docker compose -f docker-compose.dev.yml logs -f
# ============================================================

services:
  # ==================== Caddy (Reverse Proxy + HTTPS) ====================
  caddy:
    image: caddy:2-alpine
    container_name: taskhero-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 48M
        reservations:
          cpus: "0.05"
          memory: 24M
    networks:
      - taskhero-network

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: taskhero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskhero}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=20"
      - "-c"
      - "shared_buffers=80MB"
      - "-c"
      - "effective_cache_size=160MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=48MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "huge_pages=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskhero}"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 320M
        reservations:
          cpus: "0.20"
          memory: 160M
    networks:
      - taskhero-network

  # ==================== User Service ====================
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: taskhero-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskhero}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: 86400000
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-WARN}
      JAVA_TOOL_OPTIONS: "-Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/users/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.15"
          memory: 192M
    networks:
      - taskhero-network

  # ==================== Task Service ====================
  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: taskhero-task-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskhero}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      USER_SERVICE_URL: http://user-service:8081/users
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-WARN}
      JAVA_TOOL_OPTIONS: "-Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/tasks/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.15"
          memory: 192M
    networks:
      - taskhero-network

  # ==================== App (UI) ====================
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: taskhero-app
    restart: unless-stopped
    depends_on:
      - user-service
      - task-service
    environment:
      USER_SERVICE_URL: http://user-service:8081/users
      TASK_SERVICE_URL: http://task-service:8082/tasks
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-WARN}
      JAVA_TOOL_OPTIONS: "-Xss512k -XX:MaxMetaspaceSize=110m -XX:ReservedCodeCacheSize=40m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 320M
        reservations:
          cpus: "0.10"
          memory: 160M
    networks:
      - taskhero-network

networks:
  taskhero-network:
    driver: bridge
    name: taskhero-network

volumes:
  postgres-data:
    driver: local
    name: taskhero-postgres-data
  caddy-data:
    driver: local
    name: taskhero-caddy-data
  caddy-config:
    driver: local
    name: taskhero-caddy-config
