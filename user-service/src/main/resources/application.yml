spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskhero}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    drop-first: ${SPRING_LIQUIBASE_DROP_FIRST:false}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:taskhero-super-secret-key-change-me-in-production-must-be-at-least-256-bits-long}
  expiration: 86400000 # 24 hours in milliseconds

# Master Admin
admin:
  password: ${ADMIN_PASSWORD:admin123}

server:
  port: 8081
  servlet:
    context-path: /users

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    enabled: true
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    ru.taskhero.common.aop: ${LOGGING_LEVEL_RU_TASKHERO:info}
    ru.taskhero.userservice: ${LOGGING_LEVEL_RU_TASKHERO:info}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:warn}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
