<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Проверка заданий')}"></head>
<body>
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-parent}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="th-main">

            <div class="lm-page-header">
                <div>
                    <h1 class="lm-page-title">Проверка заданий</h1>
                    <p class="lm-page-sub">Одобрите или отклоните выполненные задания детей</p>
                </div>
                <span class="lm-chip warning" th:unless="${#lists.isEmpty(assignments)}"
                      th:text="${#lists.size(assignments)} + ' ожидают'">0 ожидают</span>
            </div>

            <div th:if="${success}" class="lm-banner ok mb-4">
                <i class="bi bi-check-circle-fill fs-5"></i><span th:text="${success}">Успех</span>
            </div>
            <div th:if="${error}" class="lm-banner err mb-4">
                <i class="bi bi-exclamation-triangle-fill fs-5"></i><span th:text="${error}">Ошибка</span>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(assignments)}" class="lm-empty-state">
                <div class="lm-empty-icon">✅</div>
                <div class="lm-empty-title">Всё проверено!</div>
                <div class="lm-empty-sub">Нет заданий, ожидающих вашего решения</div>
            </div>

            <!-- Review cards -->
            <div th:unless="${#lists.isEmpty(assignments)}" class="row g-4">
                <div th:each="a : ${assignments}" th:with="child=${childrenById != null ? childrenById.get(a.childId) : null}"
                     class="col-md-6 col-xl-4">
                    <div class="lm-review h-100">

                        <!-- Header: child avatar + task name + SLA chip -->
                        <div class="lm-review-hdr">
                            <div class="lm-review-avatar">
                                <!-- Safe: child is nullable — falls back to 👤 gracefully -->
                                <img th:if="${child?.avatarUrl}" th:src="${child.avatarUrl}" alt="Аватар" class="lm-avatar-img">
                                <span th:unless="${child?.avatarUrl}">👤</span>
                            </div>
                            <div class="flex-grow-1 min-width-0">
                                <div class="lm-review-child"
                                     th:text="${child?.nickname
                                             ?: child?.firstName
                                             ?: 'Ребёнок'}">Ребёнок</div>
                                <div class="lm-review-when">
                                    <i class="bi bi-clock me-1"></i>
                                    <span th:if="${a.submittedAt}"
                                          th:attr="data-utc-datetime=${a.submittedAt}"
                                          th:text="${a.submittedAt}">—</span>
                                    <span th:unless="${a.submittedAt}">—</span>
                                </div>
                            </div>
                            <span class="lm-chip warning flex-shrink-0">На проверке</span>
                        </div>

                        <!-- Task name -->
                        <div style="font-weight:600;font-size:var(--fs-base);color:var(--ink-900);"
                             th:text="${a.template?.title}">Задание</div>

                        <!-- Description -->
                        <div th:if="${a.template?.description}"
                             class="lm-review-task" th:text="${a.template.description}">Описание</div>

                        <!-- Child comment -->
                        <div th:if="${a.childComment}"
                             style="background:var(--ink-050);border-radius:var(--r-sm);padding:10px 12px;
                                    font-size:var(--fs-sm);color:var(--ink-700);">
                            <i class="bi bi-chat-left-text me-1" style="color:var(--ink-400);"></i>
                            <span th:text="${a.childComment}">Комментарий</span>
                        </div>

                        <!-- Rewards -->
                        <div class="d-flex gap-2 flex-wrap">
                            <span class="lm-chip success" th:if="${a.template?.expReward}">
                                ⭐ <span th:text="${a.template.expReward}">10</span> EXP
                            </span>
                            <span class="lm-chip accent" th:if="${a.template?.coinsReward}">
                                🪙 <span th:text="${a.template.coinsReward}">5</span> монет
                            </span>
                        </div>

                        <!-- Actions -->
                        <div class="lm-review-actions mt-auto">
                            <form th:action="@{/parent/assignments/{id}/approve(id=${a.id})}" method="post" class="flex-fill">
                                <button type="submit" class="lm-btn lm-btn-primary w-100 justify-content-center">
                                    <i class="bi bi-check-lg me-1"></i>Одобрить
                                </button>
                            </form>
                            <button class="lm-btn lm-btn-secondary flex-shrink-0" type="button"
                                    th:attr="data-bs-toggle='collapse', data-bs-target='#reject-' + ${a.id}">
                                <i class="bi bi-x-lg me-1"></i>Отклонить
                            </button>
                            <form th:action="@{/parent/assignments/{id}/delete(id=${a.id})}" method="post"
                                  onsubmit="return confirm('Удалить задание?');">
                                <input type="hidden" name="redirectTo" value="review">
                                <button type="submit" class="lm-btn lm-btn-ghost lm-btn-icon" title="Удалить">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>

                        <!-- Reject collapse -->
                        <div th:id="'reject-' + ${a.id}" class="collapse">
                            <form th:action="@{/parent/assignments/{id}/reject(id=${a.id})}" method="post">
                                <div class="mb-2">
                                    <textarea class="form-control" name="comment" rows="2"
                                              placeholder="Комментарий (необязательно)"></textarea>
                                </div>
                                <button type="submit" class="lm-btn lm-btn-primary w-100 justify-content-center"
                                        style="background:var(--brand-danger);">
                                    <i class="bi bi-x-circle me-1"></i>Подтвердить отклонение
                                </button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
