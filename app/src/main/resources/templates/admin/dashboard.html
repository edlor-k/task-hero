<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Админ-панель')}"></head>
<body>
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-admin}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="th-main">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h4>
            </div>

            <!-- Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Stat cards -->
            <div class="row g-3 mb-4" th:if="${stats != null}">
                <div class="col-md-4 col-lg-2">
                    <div class="card">
                        <div class="card-body text-center">
                            <div class="stat-icon bg-primary bg-opacity-10 text-primary mx-auto mb-2">
                                <i class="bi bi-people-fill"></i>
                            </div>
                            <h4 class="mb-0 fw-bold" th:text="${stats.totalUsers()}">0</h4>
                            <small class="text-muted">Всего</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-lg-2">
                    <div class="card">
                        <div class="card-body text-center">
                            <div class="stat-icon bg-info bg-opacity-10 text-info mx-auto mb-2">
                                <i class="bi bi-person-badge-fill"></i>
                            </div>
                            <h4 class="mb-0 fw-bold" th:text="${stats.totalParents()}">0</h4>
                            <small class="text-muted">Родителей</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-lg-2">
                    <div class="card">
                        <div class="card-body text-center">
                            <div class="stat-icon bg-warning bg-opacity-10 text-warning mx-auto mb-2">
                                <i class="bi bi-person-hearts"></i>
                            </div>
                            <h4 class="mb-0 fw-bold" th:text="${stats.totalChildren()}">0</h4>
                            <small class="text-muted">Детей</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-lg-2">
                    <div class="card">
                        <div class="card-body text-center">
                            <div class="stat-icon bg-success bg-opacity-10 text-success mx-auto mb-2">
                                <i class="bi bi-check-circle-fill"></i>
                            </div>
                            <h4 class="mb-0 fw-bold" th:text="${stats.activeUsers()}">0</h4>
                            <small class="text-muted">Активных</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 col-lg-2">
                    <div class="card">
                        <div class="card-body text-center">
                            <div class="stat-icon bg-danger bg-opacity-10 text-danger mx-auto mb-2">
                                <i class="bi bi-x-circle-fill"></i>
                            </div>
                            <h4 class="mb-0 fw-bold" th:text="${stats.inactiveUsers()}">0</h4>
                            <small class="text-muted">Заблокир.</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Quick Actions -->
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="fw-bold mb-3"><i class="bi bi-lightning me-2"></i>Быстрые действия</h5>
                            <div class="d-grid gap-2">
                                <a th:href="@{/admin/users}" class="btn btn-outline-primary">
                                    <i class="bi bi-people me-1"></i>Управление пользователями
                                </a>
                                <a th:href="@{/admin/parents}" class="btn btn-outline-info">
                                    <i class="bi bi-person-badge me-1"></i>Просмотр родителей
                                </a>
                                <a th:href="@{/admin/children}" class="btn btn-outline-warning">
                                    <i class="bi bi-person-hearts me-1"></i>Просмотр детей
                                </a>
                                <a th:href="@{/admin/statistics}" class="btn btn-outline-success">
                                    <i class="bi bi-bar-chart me-1"></i>Статистика
                                </a>
                                <a th:href="@{/admin/audit}" class="btn btn-outline-secondary">
                                    <i class="bi bi-journal-text me-1"></i>Журнал аудита
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Audit -->
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between mb-3">
                                <h5 class="fw-bold mb-0"><i class="bi bi-journal-text me-2"></i>Последние действия</h5>
                                <a th:href="@{/admin/audit}" class="btn btn-sm btn-outline-primary">Все записи</a>
                            </div>
                            <div th:if="${recentAudit == null || #lists.isEmpty(recentAudit)}" class="text-center py-4">
                                <p class="text-muted mb-0">Нет записей</p>
                            </div>
                            <div class="table-responsive" th:unless="${recentAudit == null || #lists.isEmpty(recentAudit)}">
                                <table class="table table-sm align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>Время</th>
                                        <th>Админ</th>
                                        <th>Действие</th>
                                        <th>Детали</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="log : ${recentAudit}">
                                        <td class="text-nowrap">
                                            <small th:text="${log['createdAt'] != null ? #strings.substring(log['createdAt'], 0, 16) : '-'}">-</small>
                                        </td>
                                        <td><small th:text="${log['adminEmail']}">admin</small></td>
                                        <td>
                                            <span class="badge bg-secondary" th:text="${log['action']}">ACTION</span>
                                        </td>
                                        <td><small class="text-muted" th:text="${log['details']}">-</small></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
