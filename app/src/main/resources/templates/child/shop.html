<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Магазин')}"></head>
<body>
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-child}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: header}"></header>
        <main class="th-main">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-shop me-2"></i>Магазин</h4>
                <div class="badge bg-warning text-dark fs-6 px-3 py-2">
                    <i class="bi bi-coin me-1"></i><span th:text="${childProfile.coins}">0</span> коинов
                </div>
            </div>

            <!-- Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Shop items -->
            <div th:if="${#lists.isEmpty(items)}" class="text-center py-5">
                <i class="bi bi-bag display-1 text-muted"></i>
                <h4 class="mt-3 text-muted">Магазин пуст</h4>
                <p class="text-muted">Скоро здесь появятся товары!</p>
            </div>

            <div th:unless="${#lists.isEmpty(items)}" class="row g-4 mb-5">
                <div th:each="item : ${items}" class="col-6 col-md-4 col-lg-3">
                    <div class="card h-100 text-center">
                        <div class="card-body">
                            <div class="display-3 mb-2" th:if="${item.iconName}" th:text="${item.iconName}">🎁</div>
                            <div class="display-3 mb-2" th:unless="${item.iconName}">🎁</div>
                            <h6 class="fw-bold" th:text="${item.title}">Товар</h6>
                            <p class="text-muted small" th:text="${item.description}" th:if="${item.description}">Описание</p>
                            <div class="mb-3">
                                <span class="badge bg-warning text-dark" th:text="${item.priceCoins} + ' коинов'">10</span>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent border-0 pb-3 px-3">
                            <form th:action="@{/child/shop/buy/{id}(id=${item.id})}" method="post">
                                <button type="submit" class="btn btn-primary w-100"
                                        th:disabled="${childProfile.coins < item.priceCoins}"
                                        onclick="return confirm('Купить этот товар?')">
                                    <i class="bi bi-cart-plus me-1"></i>Купить
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Purchases -->
            <div th:if="${purchases != null and !purchases.isEmpty()}" class="card">
                <div class="card-header bg-transparent">
                    <h5 class="fw-bold mb-0"><i class="bi bi-bag-check me-2"></i>Мои покупки</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Товар</th>
                                <th>Цена</th>
                                <th>Статус</th>
                                <th>Дата</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${purchases}">
                                <td>
                                    <span th:if="${p.shopItem?.iconName}" th:text="${p.shopItem.iconName}" class="me-1"></span>
                                    <span th:text="${p.shopItem?.title}">Товар</span>
                                </td>
                                <td><span th:text="${p.shopItem?.priceCoins}">10</span> коинов</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${p.status == 'PENDING' ? 'bg-warning text-dark' :
                                                            p.status == 'APPROVED' ? 'bg-success' :
                                                            p.status == 'REJECTED' ? 'bg-danger' : 'bg-secondary'}"
                                          th:text="${p.status == 'PENDING' ? 'Ожидает' :
                                                     p.status == 'APPROVED' ? 'Одобрено' :
                                                     p.status == 'REJECTED' ? 'Отклонено' : p.status}">Статус</span>
                                </td>
                                <td><small class="text-muted" th:text="${#temporals.format(p.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2025</small></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
