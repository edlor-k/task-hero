<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Библиотека шаблонов')}"></head>
<body>
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-admin}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="th-main">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-collection me-2"></i>Библиотека шаблонов</h4>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModal">
                    <i class="bi bi-plus-lg me-1"></i>Добавить шаблон
                </button>
            </div>

            <!-- Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label fw-semibold">Поиск</label>
                            <input type="text" id="templateSearch" class="form-control" placeholder="Название шаблона...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Категория</label>
                            <select id="templateCategory" class="form-select">
                                <option value="">Все категории</option>
                                <option value="STUDY">Учёба</option>
                                <option value="HOUSEHOLD">По дому</option>
                                <option value="SPORTS">Спорт</option>
                                <option value="CREATIVITY">Творчество</option>
                                <option value="HYGIENE">Гигиена</option>
                                <option value="SOCIAL">Общение</option>
                                <option value="READING">Чтение</option>
                                <option value="OTHER">Другое</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="button" class="btn btn-secondary w-100" onclick="document.getElementById('templateSearch').value='';document.getElementById('templateCategory').value='';filterTemplates();">
                                <i class="bi bi-x-lg me-1"></i>Сбросить
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Templates table -->
            <div class="card">
                <div class="card-body">
                    <div th:if="${templates == null || #lists.isEmpty(templates)}" class="text-center py-4">
                        <p class="text-muted mb-0">Нет шаблонов в библиотеке</p>
                    </div>
                    <div class="table-responsive" th:unless="${templates == null || #lists.isEmpty(templates)}">
                        <table id="templatesTable" class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Название</th>
                                <th>Описание</th>
                                <th>Категория</th>
                                <th>Сложность</th>
                                <th>EXP</th>
                                <th>Коины</th>
                                <th class="text-end">Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="t : ${templates}">
                                <td class="fw-semibold" th:text="${t['title']}">—</td>
                                <td>
                                    <small class="text-muted"
                                           th:text="${t['description'] != null ? (#strings.length(t['description']) > 60 ? #strings.substring(t['description'], 0, 60) + '…' : t['description']) : '—'}">—</small>
                                </td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${t['category'] ?: '—'}">—</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${t['difficulty'] == 'EASY' ? 'bg-success' :
                                                          (t['difficulty'] == 'HARD' ? 'bg-danger' : 'bg-secondary')}"
                                          th:text="${t['difficulty'] ?: 'NORMAL'}">NORMAL</span>
                                </td>
                                <td th:text="${t['expReward']}">10</td>
                                <td th:text="${t['coinsReward']}">5</td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-primary me-1"
                                            data-bs-toggle="modal"
                                            th:data-bs-target="'#editModal-' + ${t['id']}"
                                            title="Редактировать">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <form method="post" th:action="@{'/admin/templates/' + ${t['id']} + '/delete'}" class="d-inline"
                                          onsubmit="return confirm('Удалить шаблон?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Удалить">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Create Modal -->
            <div class="modal fade" id="createModal" tabindex="-1">
                <div class="modal-dialog">
                    <form method="post" th:action="@{/admin/templates}" class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Новый шаблон</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Название *</label>
                                <input type="text" name="title" class="form-control" required maxlength="128"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Описание</label>
                                <textarea name="description" class="form-control" rows="3" maxlength="1024"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Категория</label>
                                    <select name="category" class="form-select">
                                        <option value="">— не выбрана —</option>
                                        <option value="STUDY">Учёба</option>
                                        <option value="HOUSEHOLD">По дому</option>
                                        <option value="SPORTS">Спорт</option>
                                        <option value="CREATIVITY">Творчество</option>
                                        <option value="HYGIENE">Гигиена</option>
                                        <option value="SOCIAL">Общение</option>
                                        <option value="READING">Чтение</option>
                                        <option value="OTHER">Другое</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Сложность</label>
                                    <select name="difficulty" class="form-select">
                                        <option value="NORMAL">Обычная</option>
                                        <option value="EASY">Лёгкая</option>
                                        <option value="HARD">Сложная</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Награда EXP</label>
                                    <input type="number" name="expReward" class="form-control" min="1" value="10"/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Награда коины</label>
                                    <input type="number" name="coinsReward" class="form-control" min="0" value="5"/>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Группа пресета</label>
                                <select name="presetGroup" class="form-select">
                                    <option value="">— не входит в пресет —</option>
                                    <option value="STUDY">📚 Учёба</option>
                                    <option value="CLEAN">🧹 Уборка</option>
                                    <option value="SPORTS">⚽ Спорт</option>
                                    <option value="HOBBY">🎨 Хобби</option>
                                    <option value="ROUTINE">🌙 Режим дня</option>
                                    <option value="GAMER">🎮 Геймер</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                            <button type="submit" class="btn btn-primary">Создать</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Edit Modals (one per template) -->
            <div th:each="t : ${templates}" class="modal fade" th:id="'editModal-' + ${t['id']}" tabindex="-1">
                <div class="modal-dialog">
                    <form method="post" th:action="@{'/admin/templates/' + ${t['id']} + '/edit'}" class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Редактировать шаблон</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Название *</label>
                                <input type="text" name="title" class="form-control" required maxlength="128"
                                       th:value="${t['title']}"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Описание</label>
                                <textarea name="description" class="form-control" rows="3" maxlength="1024"
                                          th:text="${t['description']}"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Категория</label>
                                    <select name="category" class="form-select">
                                        <option value="">— не выбрана —</option>
                                        <option value="STUDY" th:selected="${t['category'] == 'STUDY'}">Учёба</option>
                                        <option value="HOUSEHOLD" th:selected="${t['category'] == 'HOUSEHOLD'}">По дому</option>
                                        <option value="SPORTS" th:selected="${t['category'] == 'SPORTS'}">Спорт</option>
                                        <option value="CREATIVITY" th:selected="${t['category'] == 'CREATIVITY'}">Творчество</option>
                                        <option value="HYGIENE" th:selected="${t['category'] == 'HYGIENE'}">Гигиена</option>
                                        <option value="SOCIAL" th:selected="${t['category'] == 'SOCIAL'}">Общение</option>
                                        <option value="READING" th:selected="${t['category'] == 'READING'}">Чтение</option>
                                        <option value="OTHER" th:selected="${t['category'] == 'OTHER'}">Другое</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Сложность</label>
                                    <select name="difficulty" class="form-select">
                                        <option value="NORMAL" th:selected="${t['difficulty'] == 'NORMAL'}">Обычная</option>
                                        <option value="EASY" th:selected="${t['difficulty'] == 'EASY'}">Лёгкая</option>
                                        <option value="HARD" th:selected="${t['difficulty'] == 'HARD'}">Сложная</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Награда EXP</label>
                                    <input type="number" name="expReward" class="form-control" min="1"
                                           th:value="${t['expReward']}"/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Награда коины</label>
                                    <input type="number" name="coinsReward" class="form-control" min="0"
                                           th:value="${t['coinsReward']}"/>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Группа пресета</label>
                                <select name="presetGroup" class="form-select">
                                    <option value="">— не входит в пресет —</option>
                                    <option value="STUDY" th:selected="${t['presetGroup'] == 'STUDY'}">📚 Учёба</option>
                                    <option value="CLEAN" th:selected="${t['presetGroup'] == 'CLEAN'}">🧹 Уборка</option>
                                    <option value="SPORTS" th:selected="${t['presetGroup'] == 'SPORTS'}">⚽ Спорт</option>
                                    <option value="HOBBY" th:selected="${t['presetGroup'] == 'HOBBY'}">🎨 Хобби</option>
                                    <option value="ROUTINE" th:selected="${t['presetGroup'] == 'ROUTINE'}">🌙 Режим дня</option>
                                    <option value="GAMER" th:selected="${t['presetGroup'] == 'GAMER'}">🎮 Геймер</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
function filterTemplates() {
    var query = document.getElementById('templateSearch').value.toLowerCase();
    var category = document.getElementById('templateCategory').value;
    var rows = document.querySelectorAll('#templatesTable tbody tr');
    rows.forEach(function(row) {
        var title = row.querySelector('td:nth-child(1)');
        var catBadge = row.querySelector('td:nth-child(3) .badge');
        var titleText = title ? title.textContent.toLowerCase() : '';
        var catText = catBadge ? catBadge.textContent.trim() : '';
        var catMap = {'STUDY':'Учёба','HOUSEHOLD':'По дому','SPORTS':'Спорт','CREATIVITY':'Творчество','HYGIENE':'Гигиена','SOCIAL':'Общение','READING':'Чтение','OTHER':'Другое'};
        var matchQuery = !query || titleText.indexOf(query) !== -1;
        var matchCat = !category || catText === (catMap[category] || category);
        row.style.display = matchQuery && matchCat ? '' : 'none';
    });
}
document.addEventListener('DOMContentLoaded', function() {
    var search = document.getElementById('templateSearch');
    var cat = document.getElementById('templateCategory');
    if (search) search.addEventListener('input', filterTemplates);
    if (cat) cat.addEventListener('change', filterTemplates);
});
</script>
</body>
</html>
