<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Дети')}"></head>
<body>
<div class="th-layout">
    <nav th:replace="~{fragments/layout :: sidebar-admin}"></nav>
    <div class="th-content">
        <header th:replace="~{fragments/layout :: header}"></header>
        <main class="th-main">

            <div class="d-flex align-items-center justify-content-between mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-person-hearts me-2"></i>Дети</h4>
            </div>

            <!-- Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Children table -->
            <div class="card">
                <div class="card-body">
                    <div th:if="${children == null || #lists.isEmpty(children)}" class="text-center py-4">
                        <p class="text-muted mb-0">Дети не найдены</p>
                    </div>
                    <div class="table-responsive" th:unless="${children == null || #lists.isEmpty(children)}">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Имя</th>
                                <th>Уровень</th>
                                <th>EXP</th>
                                <th>Коины</th>
                                <th>Токен входа</th>
                                <th>Родитель</th>
                                <th class="text-end">Действия</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="child : ${children}">
                                <td class="fw-semibold" th:text="${child['firstName'] + ' ' + child['surname']}">Имя</td>
                                <td>
                                    <span class="badge bg-primary bg-opacity-10 text-primary" th:text="'Ур. ' + ${child['level']}">1</span>
                                </td>
                                <td th:text="${child['exp']}">0</td>
                                <td th:text="${child['coins']}">0</td>
                                <td>
                                    <code class="user-select-all small" th:if="${child['loginToken'] != null}"
                                          th:text="${child['loginToken']}">token</code>
                                    <span th:unless="${child['loginToken'] != null}" class="text-muted">—</span>
                                </td>
                                <td>
                                    <span th:if="${child['parent'] != null}"
                                          th:text="${child['parent']['firstName'] + ' ' + child['parent']['surname']}">Родитель</span>
                                    <span th:unless="${child['parent'] != null}" class="text-muted">-</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/admin/children/{id}(id=${child['id']})}"
                                           class="btn btn-sm btn-outline-primary" title="Подробнее">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <button type="button" class="btn btn-sm btn-outline-danger"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#deleteChildModal-' + ${child['id']}"
                                                title="Удалить">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <nav th:if="${totalPages != null && totalPages > 1}" class="mt-3">
                        <ul class="pagination pagination-sm justify-content-center mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/children(page=${currentPage - 1})}">«</a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item"
                                th:classappend="${i == currentPage ? 'active' : ''}">
                                <a class="page-link" th:href="@{/admin/children(page=${i})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/children(page=${currentPage + 1})}">»</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

            <!-- Delete modals -->
            <div th:each="child : ${children}">
                <div class="modal fade" th:id="'deleteChildModal-' + ${child['id']}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Удаление ребёнка</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <p>Вы уверены, что хотите удалить ребёнка
                                    <strong th:text="${child['firstName'] + ' ' + child['surname']}">Имя</strong>?
                                </p>
                                <p class="text-danger"><i class="bi bi-exclamation-triangle me-1"></i>Это действие необратимо.</p>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                                <form method="post" th:action="@{/admin/children/{id}/delete(id=${child['id']})}">
                                    <button type="submit" class="btn btn-danger">Удалить</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
