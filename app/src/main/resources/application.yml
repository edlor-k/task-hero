spring:
  application:
    name: taskhero-app

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YANDEX_CLIENT_ID:}
            client-secret: ${YANDEX_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/yandex"
            scope: login:email,login:info
            client-name: Яндекс
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info?format=json
            user-name-attribute: id

  # Отключаем datasource - app только вызывает API
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  cloud:
    openfeign:
      okhttp:
        enabled: true

server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        name: TASKHERO_SESSION

# API сервисов
services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081/users}
  task-service:
    url: ${TASK_SERVICE_URL:http://localhost:8082/tasks}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    ru.taskhero.app: ${LOGGING_LEVEL_RU_TASKHERO:DEBUG}
    org.springframework.security: ${LOGGING_LEVEL_SPRING_SECURITY:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
