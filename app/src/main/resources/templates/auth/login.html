<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body class="auth-wrapper d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="auth-card">
                    <div class="auth-logo">
                        <span class="auth-logo-chip"><i class="bi bi-trophy-fill"></i></span>
                        <span class="auth-logo-text">TaskGamer</span>
                    </div>
                    <p style="color:var(--ink-500);font-size:var(--fs-sm);margin-bottom:var(--s-6);">Вход в систему</p>

                    <div th:if="${error}" class="alert alert-danger py-2 mb-3">
                        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}">Ошибка</span>
                    </div>
                    <div th:if="${message}" class="alert alert-success py-2 mb-3">
                        <i class="bi bi-check-circle me-2"></i><span th:text="${message}">Сообщение</span>
                    </div>

                    <!-- Yandex SSO -->
                    <a th:href="@{/oauth2/authorization/yandex}"
                       class="lm-btn lm-btn-primary lm-btn-lg w-100 justify-content-center mb-3"
                       style="background:var(--brand-primary);border-color:var(--brand-primary);text-decoration:none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                             fill="currentColor" class="me-2" style="flex-shrink:0;">
                            <path d="M13.515 2H10.5C6.91 2 4 4.91 4 8.5c0 2.604 1.38 4.536 3.585 5.573L4.19 22h3.12l3.19-7.58H12v7.58h2.985V2h-1.47zm0 9.737h-1.158c-1.905 0-3.072-1.107-3.072-3.237 0-2.085 1.167-3.237 3.072-3.237h1.158v6.474z"/>
                        </svg>
                        Войти через Яндекс
                    </a>

                    <div class="d-flex align-items-center mb-3" style="gap:0.75rem;">
                        <hr style="flex:1;border-color:var(--border-subtle);margin:0;">
                        <span style="color:var(--ink-400);font-size:var(--fs-xs);white-space:nowrap;">или войдите с паролем</span>
                        <hr style="flex:1;border-color:var(--border-subtle);margin:0;">
                    </div>

                    <!-- Email / password form -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="username"
                                   name="username" placeholder="parent@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Пароль</label>
                            <input type="password" class="form-control" id="password"
                                   name="password" placeholder="Введите пароль" required>
                        </div>
                        <button type="submit" class="lm-btn lm-btn-secondary lm-btn-lg w-100 justify-content-center mb-3">Войти</button>
                    </form>

                    <div class="text-center mb-3" style="font-size:var(--fs-sm);">
                        <span style="color:var(--ink-500);">Нет аккаунта?</span>
                        <a th:href="@{/register}" class="fw-semibold text-decoration-none ms-1"
                           style="color:var(--brand-primary);">Зарегистрироваться</a>
                    </div>

                    <hr style="border-color:var(--border-subtle);">
                    <a th:href="@{/login/child}" class="lm-btn lm-btn-secondary w-100 justify-content-center"
                       style="color:var(--brand-success);border-color:var(--brand-success);">
                        <i class="bi bi-controller me-1"></i>Войти как ребёнок (по токену)
                    </a>
                </div>
            </div>
        </div>
    </div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
